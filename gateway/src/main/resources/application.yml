spring:
  application:
    name: gateway

  # ---------- Nacos 配置中心 ----------
  # Boot 3 + SCA 2023 不需要 bootstrap.yml，用 spring.config.import 在启动早期导入配置
  config:
    import:
      - optional:nacos:gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      # 鸡生蛋问题：连不上 Nacos 就拉不到配置，所以地址只能写本地
      server-addr: 127.0.0.1:8848
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP

# ---------- JWT ----------
jwt:
  # 【必须与 account-service 逐字一致】
  # 网关用它验签、account-service 用它签发，两边只要差一个字符，
  # 现象就是「登录明明成功，但所有业务接口都返回 401」。
  #
  # 生产环境必须用环境变量注入（真实密钥严禁提交到版本库）：
  #   export JWT_SECRET=<与 account-service 相同的base64密钥>
  #
  # 下面的默认值是本机开发用的临时密钥，必须与 account-service 的完全相同，
  # 只为让 IDEA 里「直接 Run」能起来；不用于任何正式环境。
  secret: "${JWT_SECRET:UwSHXD5GF2H2kh/hPSqJ62svFFkM+YW3Y0Yge3jyyY3XmjCspizQmbOgnpDSfhTF}"

# ---------- 网关认证开关 ----------
# 路由规则、white-list 这些放 Nacos（见 nacos-config/gateway.yaml），
# 这里只放「改了必须重启」的密钥类配置
