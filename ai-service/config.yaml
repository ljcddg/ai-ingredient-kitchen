# ai-service 配置（Phase 1：LLM 生成）
# 说明：这里是 Python 侧的默认值；Java 每次请求还会带一份 options 覆盖
# （model / temperature / maxAttempts / timeoutSeconds），以请求里的为准。

server:
  host: 127.0.0.1
  port: 8090

ollama:
  base_url: http://127.0.0.1:11434
  model: gemma4:e2b

generate:
  # 生成温度：0.7 是实测"有变化但不会跑偏"的值（与 dish-service 默认一致）
  temperature: 0.7
  # 最多尝试几次（含第一次）：失败重试 1 次。小模型在同一坑里连栽三次的概率不低，
  # 每次生成 10 秒上下，与其烧资源不如老实告诉用户"生成失败，请重试"
  max_attempts: 2
  # 单次模型调用超时（秒）：兜"真的卡死"，不把"并发下变慢"判成失败。
  # Ollama 并行度为 1，两个任务同时在飞时单次调用很容易超过 240 秒，
  # 所以放宽到 600（实测结论，与 dish-service 的 ai.generate.attempt-timeout-seconds 对齐）
  attempt_timeout_seconds: 600
  # 营养校验容差：本地估算与 AI 估算偏差超过这个比例判"可疑"。
  # 定 40% 这么宽是因为本地数据本身是参考值、AI 估算有天然波动（实测同菜两次差 20%）
  nutrition_tolerance: 0.4
  # 调料热量补偿（kcal）：本地估算天然不含调料（草稿里调料没有用量），
  # 一次炒菜的食用油约 15g 就是 135 kcal，不补会系统性偏低、校验一直误报
  seasoning_kcal_compensation: 120

concurrency:
  # 同时发往 Ollama 的调用上限，与 dish-service 队列并发度对齐（Ollama 并行度 1，
  # 多了也只是分时复用同一个模型实例，还会把单次调用拖到超时）。超出的请求在信号量上排队。
  max_parallel_model_calls: 2
